name: release-on-tag
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK || secrets.MAC_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"

          echo "Releasing tag: v${TAG_VERSION}"
          echo "Package version: ${PACKAGE_VERSION}"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install package test dependencies
        run: |
          npm --prefix packages/codesurf-daemon ci
          npm --prefix packages/codesurf-relay ci
          npm --prefix packages/codesurf-terminal-gateway ci
          npm --prefix apps/chat-app ci

      - name: Audit dependency trees
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm --prefix packages/codesurf-daemon audit --audit-level=low
          npm --prefix packages/codesurf-relay audit --audit-level=low
          npm --prefix packages/codesurf-terminal-gateway audit --audit-level=low
          npm --prefix apps/chat-app audit --audit-level=low

      - name: Lint and verify formatting
        run: npm run lint && npm run format:check

      - name: Typecheck release sources
        run: npm run typecheck:go && npm run typecheck:tsc

      - name: Run release gate tests
        run: npm test

      - name: Build Electron app for E2E
        run: npm run build

      - name: Build and verify web/PWA artifacts
        run: npm run build:web && npm run verify:web-build

      - name: Build standalone chat app
        run: npm --prefix apps/chat-app run build

      - name: Build, install, and smoke npm package
        run: npm run test:npm-package

      - name: Build and smoke Electrobun runtime
        run: npm run smoke:electrobun

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Electron Playwright E2E suite
        run: npm run test:e2e

      - name: Smoke built web runtime
        run: npm run test:web-smoke

      - name: Verify production-only install in an isolated worktree
        shell: bash
        run: |
          VERIFY_PARENT="$(mktemp -d "${RUNNER_TEMP}/codesurf-production-install.XXXXXX")"
          VERIFY_WORKTREE="${VERIFY_PARENT}/worktree"
          cleanup() {
            if [ -d "${VERIFY_WORKTREE}" ]; then
              git worktree remove --force "${VERIFY_WORKTREE}"
            fi
            rmdir "${VERIFY_PARENT}" 2>/dev/null || true
          }
          trap cleanup EXIT

          git worktree add --detach "${VERIFY_WORKTREE}" HEAD
          npm --prefix "${VERIFY_WORKTREE}" ci --omit=dev
          npm --prefix "${VERIFY_WORKTREE}" audit --omit=dev --audit-level=low

      - name: Build and publish GitHub release
        run: npm run release:github
