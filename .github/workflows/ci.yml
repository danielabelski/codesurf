name: ci
run-name: CI ${{ github.ref_name }}

# Pre-merge gate: typecheck + tests on every PR and push to main, so regressions
# are caught before they land (previously tests only ran at release-tag time).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install package test dependencies
        run: |
          npm --prefix packages/codesurf-daemon ci
          npm --prefix packages/codesurf-relay ci
          npm --prefix packages/codesurf-terminal-gateway ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run authoritative test gate
        run: npm test

      - name: Build Electron app for E2E
        run: npm run build

      - name: Run Playwright E2E suite
        run: npm run test:e2e
